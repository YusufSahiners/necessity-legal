*{box-sizing:border-box}

.marka i{width:10px;height:10px;border-radius:5px;background:var(--accent)}
.kart{background:var(--screen);border:1px solid var(--line);border-radius:24px;padding:36px 32px}

.ust{margin:0 0 8px;font-size:12px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--accent)}

h2{margin:32px 0 8px;font:600 21px/1.3 Fraunces,Georgia,serif;color:var(--ink)}
p{margin:0 0 12px}
b{color:var(--ink)}
a{color:var(--accent)}
.kunye{color:var(--ink3);font-size:14px;margin-bottom:8px}
.dil{float:right;font-size:14px;font-weight:700}
ol.adim{padding-left:22px}ol.adim li{margin:6px 0}
.kutu{background:var(--accent-bg);border-radius:16px;padding:16px 18px;margin:16px 0}
.uyari{background:var(--warn-bg);color:var(--warn);border-radius:16px;padding:14px 18px;margin:16px 0}
.uyari b{color:var(--warn)}
.dugme{display:inline-block;background:var(--accent);color:var(--screen);text-decoration:none;font-weight:800;padding:12px 22px;border-radius:999px;margin-top:4px}
ul.liste{padding-left:20px}ul.liste li{margin:4px 0}
footer{color:var(--ink3);font-size:13px;text-align:center;margin-top:24px}
